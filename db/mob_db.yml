# Companion pets (3.2.0, setting "pets"; npc/companion_life.txt, L_PetSpawn).
# Lookalikes of the classic tameable pets, one per class family, in the app's
# custom block (25000-31998). System/jobname.lub draws each with the real
# monster's sprite. No EXP, no drops, no skills: a pet that vanishes (its
# companion warped or fell) leaves nothing on the ground. Size, race and the
# animation timings are the real monster's; the element is Neutral 1 for all,
# and the script sets the same attack, accuracy and attack speed on every pet
# from its companion's level, so no class gets a stronger one.
