# companion-party-overhaul: companions sit down when you've stood around a while (setting "idle_sit").
# No monster within 14 cells and you within 7 cells (any spacing) for a minute: they sit, like
# players waiting on a friend. They get up when a monster comes into sight or you
# walk off more than 7 cells. The engine stands a sitter up whenever you take a step;
# 3.0.0: they then wait (Reuse_Limit_H marker from the script) until you've stood still
# about 8 s, instead of sitting back down after every step.
# Below their rest marks (Companions window, Battle tab) the engine's own resting
# comes first, as before; "take a break" in party chat still works the same.

Header:
  Type: POPULATION_STRATEGY_DB
  Version: 1

Body:
  - Mob: All
    Jobs:
      - Job: All
        Build: ct_lounge
        Start: up
        Strategies:
          - Name: up
            Rules:
              - Name: ct_lounge_quiet
                Priority: 135
                Count: { Enemy: any, Range: 14, Below: 1 }
                When: master_distance_le7
                Switch: calm
          - Name: calm
            Rules:
              - Name: ct_lounge_stir
                Priority: 135
                Count: { Enemy: any, Range: 14, AtLeast: 1 }
                Switch: up
              - Name: ct_lounge_moved
                Priority: 135
                When: master_distance_gt7
                Switch: up
              - Name: ct_lounge_a_while
                Priority: 135
                InStrategy: { AtLeast: 60000 }
                Switch: lounging
          - Name: lounging
            Rules:
              - Name: ct_lounge_get_up
                Priority: 135
                Count: { Enemy: any, Range: 14, AtLeast: 1 }
                Switch: up
              - Name: ct_lounge_follow
                Priority: 135
                When: master_distance_gt7
                Switch: up
              # Not while the script has it up for a stretch, a glance or a new spot
              # (restless_sitting): the same Entry_Queue_Apply_Delay marker as the strolls.
              - Name: ct_lounge_sit
                Priority: 21
                When: [not_self_entry_queue_apply_delay, not_self_reuse_limit_h]
                Sit: true

      # Archers, Hunters, Bards, Dancers, Gunslingers: scouts. 3.9.1, the lookout
      # round (scout_patrol, npc/companion_life.txt L_Patrol): they walk to lookout
      # spots round the party and stand watch at each about 10 s (the script's
      # Reuse_Limit_F marker: the Hold below keeps them there, so the party's follow
      # can't pull them back), one or two rounds, then sit like everyone else.
      # Was: up to 3 minutes of no monster at all within 14 cells before sitting, so in
      # most places they never sat. Now only a monster attacking the party keeps them
      # up, and a minute of calm is enough.
      - Job: [Archer, Gunslinger]
        Disable: [ct_lounge_sit]
        Build: ct_scout
        Start: up
        Strategies:
          - Name: up
            Rules:
              - Name: ct_scout_post_up
                Priority: 140
                When: self_reuse_limit_f
                Hold: true
              - Name: ct_scout_quiet
                Priority: 135
                Count: { Enemy: attacking, Range: 12, Below: 1 }
                When: master_distance_le7
                Switch: calm
          - Name: calm
            Rules:
              - Name: ct_scout_post_calm
                Priority: 140
                When: self_reuse_limit_f
                Hold: true
              - Name: ct_scout_stir
                Priority: 135
                Count: { Enemy: attacking, Range: 12, AtLeast: 1 }
                Switch: up
              - Name: ct_scout_moved
                Priority: 135
                When: master_distance_gt7
                Switch: up
              - Name: ct_scout_a_while
                Priority: 135
                InStrategy: { AtLeast: 60000 }
                Switch: lounging
          - Name: lounging
            Rules:
              - Name: ct_scout_post_lounge
                Priority: 140
                When: self_reuse_limit_f
                Hold: true
              - Name: ct_scout_get_up
                Priority: 135
                Count: { Enemy: attacking, Range: 12, AtLeast: 1 }
                Switch: up
              - Name: ct_scout_follow
                Priority: 135
                When: master_distance_gt7
                Switch: up
              - Name: ct_scout_sit
                Priority: 21
                When: [not_self_entry_queue_apply_delay, not_self_reuse_limit_h, not_self_reuse_limit_f]
                Sit: true

