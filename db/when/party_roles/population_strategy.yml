# companion-party-overhaul: party roles in every fight (setting "party_roles"). 3.0.0.
# One switch for what used to be seven (everyday roles, smart healing, smart casting, battle
# mage, front line, packs/summons/targeting). The base table (db/population_strategy.yml) is
# about bosses; this is the party in every fight, played the way players play.
#
# THE SP BANK (damage dealers). Auto-attack is normal; SP is for the bad moments.
#   steady   plain hits (melee, archers); casters cast their quick, cheap spells
#   burst    a bad moment: 3+ monsters on the party, a monster on the Priest or the back
#            line, someone under 50%, a boss; or SP at 90%+ in a fight (regen would go to
#            waste). Skills and area spells come out to bring the numbers down. Back to
#            steady after 4 s once it's under 3 monsters and SP is under 80%.
#   dry      under 25% SP (20% while bursting): only what keeps people alive, until 50%
#
# KITING. Melee: 1-2 monsters, stand and fight. 3+ on one, or losing the trade: run them
#   round the Priest (or you) so the others can work, and stand again after 10 s. Ranged:
#   step back whenever a monster reaches them, and burst when there are 3+.
#
# HEALING (Acolyte, Priest). Heal is always the full level, and only where it isn't wasted:
#   1 anyone under 50%: Heal at once        2 Kyrie on the tank being hit, then other melee,
#   3 then the back line being hit           4 anyone under 80% (lost a fifth): Heal
#   5 Safety Wall on a back-liner being hit  6 Blessing / Increase AGI renewals, Magnificat
#   70 SP always kept for Resurrection.
#
# CASTING (Mage, Wizard, Sage). Squishy and bursty: crowd control first, fast spells to
#   stop being swarmed, area spells to cut a pack down, bolts by element in between.
#
# PROTECT THE BACK LINE (the rule of thumb for every class): whatever hits the Priest, a
#   caster or an archer is hit first (the target ladder), and each class uses its own tool:
#   Swordman line Provoke (Crusader: Devotion on the Priest)   Blacksmith Hammer Fall
#   Rogue Strip Weapon   Archer line Arrow Shower knockback, Ankle Snare   Gunslinger Cracker
#   Mage line Frost Diver, Safety Wall, Ice Wall               Priest Kyrie, Safety Wall
#
# Rules named ct_* so they never replace the base table's. Priority bands as there:
#   100+ survival, 80-99 boss mechanics, 40-79 the role's core, below 40 filler.

Header:
  Type: POPULATION_STRATEGY_DB
  Version: 1

Body:
  - Mob: All
    Jobs:
      # === The SP bank: melee and archers ===================================================
      - Job: [Swordman, Thief, Merchant, Monk, Star_Gladiator, Archer, Gunslinger]
        Build: ct_bank
        Requires: { Role: [tank, attacker, none] }
        Start: steady
        Strategies:
          - Name: steady
            Rotation: false
            Rules:
              - Name: ct_bk_dry
                When: self_sp_pct_lt25
                Switch: dry
              - Name: ct_bk_pack
                Count: { Enemy: attacking, Range: 9, AtLeast: 3 }
                Switch: burst
              - Name: ct_bk_backline
                Target: { Enemy: attacking, Job: [Priest, Mage, Archer, Gunslinger], NotSelf: true }
                Switch: burst
              - Name: ct_bk_hurt
                Target: { Ally: lowest_hp }
                When: ally_hp_pct_lt50
                Switch: burst
              - Name: ct_bk_boss
                Present: { Enemy: boss }
                Switch: burst
              - Name: ct_bk_full
                When: self_sp_pct_ge90
                Present: { Enemy: attacking, Range: 9 }
                Switch: burst
          - Name: burst
            Rotation: true
            Rules:
              - Name: ct_bk_spent
                When: self_sp_pct_lt20
                Switch: dry
              - Name: ct_bk_calm
                InStrategy: { AtLeast: 4000 }
                Count: { Enemy: attacking, Range: 9, Below: 3 }
                Absent: { Enemy: boss }
                When: self_sp_pct_lt80
                Switch: steady
          - Name: dry
            Rotation: false
            Disable: [ct_pk_hammerfall, ct_pk_brandish, ct_bowling_the_pack]
            Rules:
              - Name: ct_bk_rested
                When: self_sp_pct_ge50
                Switch: steady

      # === Who to hit: the back line first ===================================================
      # The first rung that finds a monster wins (strategy.cpp: a SetTarget rule has nothing
      # left to do once a higher one picked). Rungs 1-3 claim their monster, so two companions
      # spread over two attackers of the healer. "assist me" (85) outranks all of this.
      - Job: [Swordman, Thief, Merchant, Monk, Star_Gladiator, Archer, Mage, Ninja, Gunslinger, Taekwon]
        Build: ct_target
        Requires: { Role: [tank, attacker, none] }
        Rules:
          - Name: ct_tg_healer
            Priority: 60
            Target: { Enemy: attacking, Job: Priest, NotSelf: true }
            Absent: { Enemy: boss }
            SetTarget: true
            Claim: { Name: ct.tg, For: 3000 }
          - Name: ct_tg_squishy
            Priority: 59
            Target: { Enemy: attacking, Job: [Mage, Archer, Gunslinger], NotSelf: true }
            Absent: { Enemy: boss }
            SetTarget: true
            Claim: { Name: ct.tg, For: 3000 }
          - Name: ct_tg_owner
            Priority: 58
            Target: { Enemy: attacking, Who: owner }
            Absent: { Enemy: boss }
            SetTarget: true
            Claim: { Name: ct.tg, For: 3000 }
          - Name: ct_tg_self
            Priority: 57
            Target: { Enemy: attacking, Who: self }
            Absent: { Enemy: boss }
            SetTarget: true
          - Name: ct_tg_party
            Priority: 52
            Target: { Enemy: attacking }
            Absent: { Enemy: boss }
            SetTarget: true

      # === Melee: kiting ====================================================================
      - Job: [Swordman, Thief, Merchant, Monk, Star_Gladiator]
        Build: ct_front
        Requires: { Role: [tank, attacker, none] }
        Start: hold_line
        Strategies:
          - Name: hold_line
            Rules:
              - Name: ct_fl_swarmed
                Count: { Enemy: attacking, Who: self, Range: 3, AtLeast: 3 }
                InStrategy: { AtLeast: 4000 }
                Absent: { Enemy: boss }
                Switch: kite
              - Name: ct_fl_losing
                Target: { Enemy: attacking, Who: self }
                When: [self_hp_pct_lt50, enemy_hp_pct_ge50]
                Absent: { Enemy: boss }
                Switch: kite
          - Name: kite
            Rules:
              - Name: ct_fl_boss_here
                Present: { Enemy: boss }
                Switch: hold_line
              - Name: ct_fl_settled
                Count: { Enemy: attacking, Who: self, Range: 3, Below: 2 }
                When: self_hp_pct_ge60
                Switch: hold_line
              - Name: ct_fl_kite_done
                InStrategy: { AtLeast: 10000 }
                When: self_hp_pct_ge45
                Switch: hold_line
              - Name: ct_fl_kite_healer
                Priority: 62
                Target: { Ally: nearest, Job: Priest, NotSelf: true, Range: 14 }
                Kite: { Away: 3, Within: 6, Gap: 3 }
              - Name: ct_fl_kite_owner
                Priority: 61
                Target: owner
                When: master_distance_le9         # not a roamer: that would drag it back to you
                Kite: { Away: 3, Within: 6, Gap: 3 }

      # === Swordman line: peel and shield ====================================================
      # Provoke what is on the Priest or a caster, with 40 SP kept (a Crusader with little INT
      # emptied itself in a fight or two and then sat for minutes).
      - Job: Swordman
        Build: ct_peel
        Requires: { Role: [tank, attacker, none] }
        Rules:
          - Name: ct_peel_provoke
            Priority: 80
            Cast: SM_PROVOKE
            Target: { Enemy: attacking, Job: [Priest, Mage], NotSelf: true }
            When: [not_enemy_provoke, self_sp_ge40]
            Absent: { Enemy: boss }
            SetTarget: true
            Claim: { Name: ct.provoke, For: 6000 }
            Cooldown: 6000
      - Job: Knight
        Build: ct_pack
        Requires: { Role: [tank, attacker, none] }
        Rules:
          - Name: ct_bowling_the_pack
            Priority: 46
            Cast: KN_BOWLINGBASH
            Target: { Enemy: attacking }
            Count: { Enemy: attacking, Around: target, Range: 2, AtLeast: 3 }
            When: self_sp_pct_ge30
            Cooldown: 2000
          - Name: ct_pk_brandish
            Priority: 47
            Cast: KN_BRANDISHSPEAR
            Target: { Enemy: attacking }
            Count: { Enemy: attacking, Around: target, Range: 2, AtLeast: 3 }
            When: self_sp_pct_ge30
            Absent: { Enemy: boss }
            Cooldown: 2000
      - Job: Crusader
        Build: ct_shield
        Requires: { Role: [tank, none] }
        Rules:
          # Take the healer's hits on itself: only the Priest (Job: Acolyte also matched a
          # Champion owner, so Devotion went on the player), and only at full SP, so it is
          # recast once per rest instead of every time the link breaks.
          - Name: ct_devotion_the_healer
            Priority: 66
            Cast: CR_DEVOTION
            Target: { Ally: missing, Status: SC_DEVOTION, Job: Priest, NotSelf: true, NotOwner: true }
            When: [self_hp_pct_ge60, self_sp_pct_ge95]
            Cooldown: 10000
          - Name: ct_auto_guard
            Priority: 65
            Cast: CR_AUTOGUARD
            Target: self
            When: [self_targeted, not_self_autoguard, self_sp_ge60]
          - Name: ct_reflect_shield
            Priority: 64
            Cast: CR_REFLECTSHIELD
            Target: self
            Count: { Enemy: attacking, Who: self, AtLeast: 2 }
            When: [not_self_reflectshield, self_sp_ge150]

      # === Merchant and Thief lines: their tools for the back line ==========================
      - Job: Blacksmith
        Build: ct_pack
        Requires: { Role: [tank, attacker, none] }
        Rules:
          - Name: ct_pk_hammer_guard
            Priority: 48
            Cast: BS_HAMMERFALL
            Target: { Enemy: attacking, Job: [Priest, Mage, Archer, Gunslinger], NotSelf: true }
            When: [not_enemy_stun, self_sp_ge40]
            Absent: { Enemy: boss }
            Cooldown: 4000
          - Name: ct_pk_hammerfall
            Priority: 47
            Cast: BS_HAMMERFALL
            Target: { Enemy: attacking }
            Count: { Enemy: attacking, Around: target, Range: 2, AtLeast: 3 }
            When: [not_enemy_stun, self_sp_ge40]
            Absent: { Enemy: boss }
            Cooldown: 4000
      - Job: Rogue
        Build: ct_pack
        Requires: { Role: [tank, attacker, none] }
        Rules:
          - Name: ct_rg_divest_guard
            Priority: 48
            Cast: RG_STRIPWEAPON
            Target: { Enemy: attacking, Job: [Priest, Mage], NotSelf: true }
            When: [not_enemy_stripweapon, self_sp_pct_ge30]
            Absent: { Enemy: boss }
            Claim: { Name: ct.divest, For: 15000 }
            Cooldown: 6000

      # === Archers and Gunslingers: ranged kiting ============================================
      - Job: [Archer, Gunslinger]
        Build: ct_ranged
        Requires: { Role: [attacker, none] }
        Rules:
          # Something reached it: step back and keep shooting (with or without a tank).
          - Name: ct_rng_step_back
            Priority: 61
            Target: { Enemy: attacking, Who: self, Range: 2 }
            Absent: { Enemy: boss }
            KeepDistance: 4
            Cooldown: 3000
      - Job: Archer
        Build: ct_shower
        Requires: { Role: [attacker, none] }
        Rules:
          # Arrow Shower's knockback (2 cells) off the Priest or a caster, then off the melee.
          - Name: ct_shower_off_back
            Priority: 49
            Cast: AC_SHOWER
            Target: { Enemy: attacking, Job: [Priest, Mage], NotSelf: true }
            When: self_sp_pct_ge20
            Absent: { Enemy: boss }
            Cooldown: 2000
          - Name: ct_shower_off_front
            Priority: 47
            Cast: AC_SHOWER
            Target: { Enemy: attacking, Job: [Swordman, Thief, Merchant, Monk, Star_Gladiator] }
            Count: { Enemy: attacking, Around: target, Range: 2, AtLeast: 2 }
            When: self_sp_pct_ge20
            Cooldown: 1500
          # Hunters snare what is on the healer or a caster.
          - Name: ct_snare_the_healers_attacker
            Priority: 46
            Cast: HT_ANKLESNARE
            Target: { Enemy: attacking, Job: [Priest, Mage], NotSelf: true }   # Job: Acolyte also matched a Monk/Champion
            When: not_enemy_ankle
            Consume: true                    # a Trap, with Companion inventory on
            Claim: { Name: ct.snare, For: 8000 }
            Cooldown: 6000
      - Job: Gunslinger
        Build: ct_shower
        Requires: { Role: [attacker, none] }
        Rules:
          - Name: ct_gs_cracker
            Priority: 48
            Cast: GS_CRACKER
            Target: { Enemy: attacking, Job: [Priest, Mage], NotSelf: true }
            When: [not_enemy_stun, self_sp_pct_ge20]
            Absent: { Enemy: boss }
            Cooldown: 3000

      # === Healers ===========================================================================
      - Job: [Acolyte, Priest]
        Exact: true
        Build: ct_heal
        Requires: { Role: [support, none] }
        Rules:
          - Name: ct_heal_now
            Priority: 90
            Cast: AL_HEAL
            Level: 10
            Target: { Ally: lowest_hp }
            When: [ally_hp_pct_lt50, self_sp_ge70]
          - Name: ct_kyrie_tank
            Priority: 88
            Cast: PR_KYRIE
            Target: { Ally: attacked, Job: Swordman }
            When: [not_ally_kyrie, self_sp_ge90]
            Claim: { Name: ct.kyrie, For: 4000 }
            Cooldown: 3000
          - Name: ct_kyrie_melee
            Priority: 87
            Cast: PR_KYRIE
            Target: { Ally: attacked, Job: [Thief, Merchant, Monk, Star_Gladiator, Taekwon] }
            When: [not_ally_kyrie, self_sp_ge90]
            Claim: { Name: ct.kyrie, For: 4000 }
            Cooldown: 3000
          - Name: ct_kyrie_back
            Priority: 86
            Cast: PR_KYRIE
            Target: { Ally: attacked, Job: [Priest, Mage, Archer, Gunslinger, Ninja] }
            When: [not_ally_kyrie, self_sp_ge90]
            Claim: { Name: ct.kyrie, For: 4000 }
            Cooldown: 3000
          - Name: ct_heal_hurt
            Priority: 85
            Cast: AL_HEAL
            Level: 10
            Target: { Ally: lowest_hp }
            When: [ally_hp_pct_lt80, self_sp_ge70]
          - Name: ct_wall_back
            Priority: 84
            Cast: MG_SAFETYWALL
            Target: { Ally: attacked, Job: [Priest, Mage, Archer, Gunslinger] }
            Field: { Skill: MG_SAFETYWALL, Owner: party, At: target, Range: 0, Below: 1 }
            When: [not_ally_safetywall, self_sp_ge120]
            Consume: true
            Cooldown: 6000
          # Blessing and Increase AGI renewed a few seconds before they run out,
          # one healer per member.
          - Name: ct_renew_blessing
            Priority: 43
            Cast: AL_BLESSING
            Target: { Ally: missing, Status: SC_BLESSING, Expiring: 8000 }
            When: self_sp_pct_ge25
            Claim: { Name: ct.bless, For: 4000 }
            Cooldown: 1500
          - Name: ct_renew_agi
            Priority: 42
            Cast: AL_INCAGI
            Target: { Ally: missing, Status: SC_INCREASEAGI, Expiring: 8000 }
            When: self_sp_pct_ge25
            Claim: { Name: ct.agi, For: 4000 }
            Cooldown: 1500
          # Nothing on it: keep three cells off the fight, in the back row.
          - Name: ct_healer_back_row
            Priority: 35
            When: not_self_targeted
            Target: { Enemy: attacking, Range: 14 }
            KeepDistance: 3
            Cooldown: 2500
          # Between fights, with SP to spare: Magnificat for everyone's SP.
          - Name: ct_magnificat
            Priority: 30
            Cast: PR_MAGNIFICAT
            Target: self
            When: [not_self_magnificat, self_sp_ge100]
            Absent: { Enemy: attacking, Range: 14 }
            OnePerParty: true
            Cooldown: 30000
      - Job: Priest
        Build: ct_pack
        Requires: { Role: [support, none] }
        Rules:
          - Name: ct_pk_magnus_undead
            Priority: 45
            Cast: PR_MAGNUS
            Target: { Enemy: attacking, Race: Undead }
            Count: { Enemy: attacking, Race: Undead, Around: target, Range: 3, AtLeast: 3 }
            When: self_sp_pct_ge60
            Absent: { Enemy: boss }
            Consume: true
            Cooldown: 8000
          - Name: ct_pk_magnus_demon
            Priority: 45
            Cast: PR_MAGNUS
            Target: { Enemy: attacking, Race: Demon }
            Count: { Enemy: attacking, Race: Demon, Around: target, Range: 3, AtLeast: 3 }
            When: self_sp_pct_ge60
            Absent: { Enemy: boss }
            Consume: true
            Cooldown: 8000

      # === Casters: Mage, Wizard, Sage ======================================================
      # They don't hit with a rod (base table), so "steady" for them is their quick spells.
      - Job: Mage
        Build: ct_caster
        Requires: { Role: [attacker, none] }
        Rotation: false                 # only the spells named here
        Start: steady
        Rules:
          - Name: ct_cs_wall_self
            Priority: 70
            Cast: MG_SAFETYWALL
            Target: self
            When: [melee_attacked, not_self_safetywall, self_sp_ge40]
            Consume: true
            Cooldown: 4000
          - Name: ct_ir_freeze             # break a dangerous cast (a frozen monster stops casting)
            Priority: 69
            Cast: MG_FROSTDIVER
            Target: { Enemy: casting, Skill: [AL_HEAL, NPC_SUMMONSLAVE, NPC_CALLSLAVE, NPC_SUMMONMONSTER, NPC_DARKBREATH, NPC_DARKSTRIKE, NPC_EARTHQUAKE, WZ_HEAVENDRIVE, WZ_STORMGUST, WZ_METEOR, WZ_VERMILION, WZ_JUPITEL, MG_THUNDERSTORM] }
            When: not_enemy_freeze
            Absent: { Enemy: boss }
            Claim: { Name: ct.interrupt, For: 2000 }
          - Name: ct_cs_wall_priest
            Priority: 68
            Cast: MG_SAFETYWALL
            Target: { Ally: attacked, Job: Priest, NotSelf: true }
            Field: { Skill: MG_SAFETYWALL, Owner: party, At: target, Range: 0, Below: 1 }
            When: self_sp_ge40
            Absent: { Enemy: boss }
            Consume: true
            OnePerParty: true
            Cooldown: 5000
          - Name: ct_cs_freeze_ally
            Priority: 67
            Cast: MG_FROSTDIVER
            Target: { Enemy: attacking, Job: [Priest, Archer, Mage, Gunslinger], NotSelf: true }
            When: [not_enemy_freeze, self_sp_ge30]
            Absent: { Enemy: boss }
            Claim: { Name: ct.freeze, For: 4000 }
            Cooldown: 1500
          - Name: ct_cs_freeze_self
            Priority: 66
            Cast: MG_FROSTDIVER
            Target: { Enemy: attacking, Who: self }
            When: [melee_attacked, not_enemy_freeze, self_sp_ge30]
            Absent: { Enemy: boss }
            Claim: { Name: ct.freeze, For: 4000 }
            Cooldown: 2000
          - Name: ct_cs_quick
            Priority: 65
            Cast: MG_SOULSTRIKE
            Target: { Enemy: attacking, Who: self }
            When: [melee_attacked, self_sp_ge60]
            Absent: { Enemy: boss }
            Cooldown: 1200
          - Name: ct_cs_icewall
            Priority: 60
            Cast: WZ_ICEWALL
            Target: { Enemy: attacking, Who: self }
            Aim: { Cells: 3 }
            Field: { Skill: WZ_ICEWALL, Owner: self, Range: 5, Below: 1 }
            When: self_sp_pct_ge30
            Absent: { Ally: nearest, Job: Swordman, NotSelf: true, Range: 5 }
            Count: { Enemy: boss, Range: 14, Below: 1 }
            Cooldown: 3000
          - Name: ct_cs_firewall
            Priority: 59
            Cast: MG_FIREWALL
            Target: { Enemy: attacking, Who: self }
            Aim: { Cells: 2, From: target, Lead: true }
            Field: { Skill: MG_FIREWALL, Owner: self, Range: 9, Below: 1 }
            When: [self_sp_pct_ge30, enemy_distance_ge3]
            Absent: { Enemy: boss }
            Cooldown: 4000
          # Nearly dead: a small bolt by element, not a 7-second one.
          - Name: ct_cs_finisher
            Priority: 45
            Cast: [MG_COLDBOLT, MG_FIREBOLT, MG_LIGHTNINGBOLT, WZ_EARTHSPIKE]
            Level: 3
            Target: { Enemy: attacking }
            When: [enemy_hp_pct_lt20, self_sp_ge40]
            Absent: { Enemy: boss }
          - Name: ct_cs_bolt
            Priority: 43
            Cast: [MG_COLDBOLT, MG_FIREBOLT, MG_LIGHTNINGBOLT, WZ_EARTHSPIKE]
            Target: { Enemy: attacking }
            When: self_sp_pct_ge25
            Absent: { Enemy: boss }
        Strategies:
          - Name: steady
            Rules:
              - Name: ct_cs_dry
                When: self_sp_pct_lt25
                Switch: dry
              - Name: ct_cs_pack
                Count: { Enemy: attacking, Range: 9, AtLeast: 3 }
                Switch: burst
              - Name: ct_cs_backline
                Target: { Enemy: attacking, Job: [Priest, Mage, Archer, Gunslinger] }
                Switch: burst
              - Name: ct_cs_hurt
                Target: { Ally: lowest_hp }
                When: ally_hp_pct_lt50
                Switch: burst
              - Name: ct_cs_full
                When: self_sp_pct_ge90
                Present: { Enemy: attacking, Range: 9 }
                Switch: burst
          - Name: burst
            Rules:
              - Name: ct_cs_spent
                When: self_sp_pct_lt20
                Switch: dry
              - Name: ct_cs_calm
                InStrategy: { AtLeast: 4000 }
                Count: { Enemy: attacking, Range: 9, Below: 3 }
                When: self_sp_pct_lt80
                Switch: steady
              - Name: ct_cs_quagmire
                Priority: 58
                Cast: WZ_QUAGMIRE
                Target: { Enemy: attacking }
                Count: { Enemy: attacking, Around: target, Range: 2, AtLeast: 3 }
                When: not_enemy_quagmire
                Absent: { Enemy: boss }
                Cooldown: 6000
              # 3+ bunched: the area spell by element (Lord of Vermilion wind, Storm Gust water,
              # Meteor Storm fire, Heaven's Drive earth; a Mage's Fire Ball / Thunder Storm).
              - Name: ct_cs_aoe
                Priority: 57
                Cast: [WZ_VERMILION, WZ_STORMGUST, WZ_METEOR, WZ_HEAVENDRIVE, MG_FIREBALL, MG_THUNDERSTORM]
                Target: { Enemy: attacking }
                Count: { Enemy: attacking, Around: target, Range: 2, AtLeast: 3 }
                Absent: { Enemy: boss }
                Cooldown: 3000
              # Jupitel Thunder: 12 hits, no delay, pushes it away.
              - Name: ct_cs_jupitel
                Priority: 56
                Cast: WZ_JUPITEL
                Target: { Enemy: attacking, Who: self }
                Absent: { Enemy: boss }
                Cooldown: 2000
              - Name: ct_cs_jupitel_priest
                Priority: 55
                Cast: WZ_JUPITEL
                Target: { Enemy: attacking, Job: Priest }
                Absent: { Enemy: boss }
                Cooldown: 2000
          - Name: dry
            Disable: [ct_cs_bolt, ct_cs_finisher, ct_cs_icewall, ct_cs_firewall, ct_cs_quick]
            Rules:
              - Name: ct_cs_rested
                When: self_sp_pct_ge50
                Switch: steady

      # Summons (any monster, bosses too: the boss plans name only Phreeoni's): the area spell
      # on the summoner once 3 slaves stand round it, or on 3+ bunched slaves.
      - Job: Mage
        Build: ct_summons
        Rules:
          - Name: ct_sm_summon_slave
            Priority: 82
            On: { Event: casts, Skill: NPC_SUMMONSLAVE, Within: 8000 }
            Cast: [WZ_VERMILION, WZ_STORMGUST, WZ_METEOR, WZ_HEAVENDRIVE, MG_FIREBALL, MG_THUNDERSTORM]
            Target: source
            Count: { Enemy: slaves, Around: target, Range: 5, AtLeast: 3 }
            When: self_sp_pct_ge30
          - Name: ct_sm_call_slave
            Priority: 82
            On: { Event: casts, Skill: NPC_CALLSLAVE, Within: 8000 }
            Cast: [WZ_VERMILION, WZ_STORMGUST, WZ_METEOR, WZ_HEAVENDRIVE, MG_FIREBALL, MG_THUNDERSTORM]
            Target: source
            Count: { Enemy: slaves, Around: target, Range: 5, AtLeast: 3 }
            When: self_sp_pct_ge30
          - Name: ct_sm_summon_monster
            Priority: 82
            On: { Event: casts, Skill: NPC_SUMMONMONSTER, Within: 8000 }
            Cast: [WZ_VERMILION, WZ_STORMGUST, WZ_METEOR, WZ_HEAVENDRIVE, MG_FIREBALL, MG_THUNDERSTORM]
            Target: source
            Count: { Enemy: any, Around: target, Range: 5, AtLeast: 3 }
            When: self_sp_pct_ge30
          - Name: ct_sm_slaves
            Priority: 49
            Cast: [WZ_VERMILION, WZ_STORMGUST, WZ_METEOR, WZ_HEAVENDRIVE, MG_FIREBALL, MG_THUNDERSTORM]
            Target: { Enemy: slaves }
            Count: { Enemy: slaves, Around: target, Range: 3, AtLeast: 3 }
            When: self_sp_pct_ge30
            Cooldown: 4000

      # Archers break a dangerous cast with Double Strafe.
      - Job: Archer
        Build: ct_interrupt
        Rules:
          - Name: ct_ir_strafe
            Priority: 70
            Cast: AC_DOUBLE
            Target: { Enemy: casting, Skill: [AL_HEAL, NPC_SUMMONSLAVE, NPC_CALLSLAVE, NPC_SUMMONMONSTER, NPC_DARKBREATH, NPC_DARKSTRIKE, NPC_EARTHQUAKE, WZ_HEAVENDRIVE, WZ_STORMGUST, WZ_METEOR, WZ_VERMILION, WZ_JUPITEL, MG_THUNDERSTORM] }
            Absent: { Enemy: boss }
            Claim: { Name: ct.interrupt, For: 2000 }

      # Ninjas: the spells. Untick the spells in the companion's skills for a throwing
      # (physical) Ninja and these rules no longer exist for it.
      - Job: Ninja
        Build: ct_nj
        Requires: { Role: [attacker, none], Skills: [NJ_HYOUSENSOU] }
        Rules:
          - Name: ct_nj_pack
            Priority: 46
            Cast: NJ_BAKUENRYU
            Target: { Enemy: attacking }
            Count: { Enemy: attacking, Around: target, Range: 2, AtLeast: 3 }
            When: self_sp_pct_ge30
            Consume: true
            Cooldown: 3000
          - Name: ct_nj_finisher
            Priority: 45
            Cast: [NJ_HYOUSENSOU, NJ_KOUENKA, NJ_HUUJIN]
            Level: 3
            Target: { Enemy: attacking }
            When: [enemy_hp_pct_lt20, self_sp_ge30]
            Absent: { Enemy: boss }
          - Name: ct_nj_spell
            Priority: 44
            Cast: [NJ_HYOUSENSOU, NJ_KOUENKA, NJ_HUUJIN]
            Target: { Enemy: attacking }
            When: [self_sp_pct_ge20, self_sp_ge60]

