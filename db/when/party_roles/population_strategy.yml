                SN_SHARPSHOOTING, SN_FALCONASSAULT, SN_WINDWALK, SN_SIGHT]

      # === Out of ammo (3.14.5, the user's design) =============================================
      # A bow or gun with an empty ammo slot: the script (npc/companion_life.txt) puts the
      # harmless Reuse_Limit_Luxanima on it each tick and says once "I'm out of arrows/bullets".
      # Every bow and gun skill needs ammo in pre-re; these don't, so they are spammed instead:
      # a cast the engine refuses (still in its delay, no SP, no coin) passes to the next rule.
      #   Sniper: Falcon Assault (25 falcon hits' worth in 4 s, range 9), at bosses too. Blitz
      #   Beat (5 hits in 2.5 s, range 5) only when SP is short of Falcon Assault's 46.
      #   Hunter: Blitz Beat. Gunslinger: Magical Bullet on a coin, Flip the Coin with none.
      #   Archer: nothing works without arrows; it stays back as before.
      - Job: Hunter
        Build: ct_dry_falcon
        Rules:
          - Name: ct_dry_falcon_assault
            Priority: 57
            Cast: SN_FALCONASSAULT
            Target: { Enemy: attacking, Range: 9 }
            When: self_reuse_limit_luxanima
          - Name: ct_dry_falcon_assault_yours
            Priority: 57
            Cast: SN_FALCONASSAULT
            Target: { Enemy: target_of, Who: owner, Range: 9 }
            When: self_reuse_limit_luxanima
          - Name: ct_dry_blitz
            Priority: 53
            Cast: HT_BLITZBEAT
            Target: { Enemy: attacking, Range: 5 }
            When: self_reuse_limit_luxanima
          - Name: ct_dry_blitz_yours
            Priority: 53
            Cast: HT_BLITZBEAT
            Target: { Enemy: target_of, Who: owner, Range: 5 }
            When: self_reuse_limit_luxanima
