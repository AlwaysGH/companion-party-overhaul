      # === Hunter and Sniper: traps with a purpose ===========================================
      # Traps are the Hunter's Safety Wall: laid where a monster is about to walk, never at
      # random. Every rule needs a monster on the party, so nothing is laid in town or while
      # waiting; each costs a Trap (Companion inventory on) and has its own cooldown.
      #   rAthena won't put a trap on a cell someone stands on, so each one is aimed a cell
      #   off the monster (Aim): on the line it walks to reach the Hunter or the one it chases.
      # The plan below (ct_trap_kit) keeps the engine itself from laying any: its Hunter and
      # Sniper lists lay Skid Trap, Sandman, Flasher, Shockwave and Blast Mine at their own
      # feet every 20-30 s as if they were buffs, and roll Claymore, Freezing Trap, Ankle
      # Snare and Land Mine in every fight. Allow binds only what the engine picks itself, so
      # these rules (and the "trap" order) still lay theirs. It can't sit in this plan: a
      # plan never limits the skills its own rules cast.
      - Job: Hunter
        Build: ct_trapper
        Rules:
          # 3.14.5: rAthena won't lay a trap on or next to ANY character (UF_NOFOOTSET: the
          # trace said "the cell is taken: Serawen stands too near it"), so every trap aimed 1
          # cell from the Hunter or from a monster was refused, every time. Now they only go
          # down for something still on its way (4+ cells off), 2 cells out toward it: it walks
          # into the trap, and nobody stands beside the cell. Up close: arrows, no trap.
          # Kiting: something comes at the Hunter (it steps back first, ct_rng_step_back).
          - Name: ct_trap_guard_self
            Priority: 56
            Cast: HT_ANKLESNARE
            Target: { Enemy: attacking, Who: self, Range: 9 }
            Aim: { Cells: 2, From: self }
            When: [not_enemy_ankle, enemy_distance_ge4]
            Absent: { Enemy: boss, Mob: [OSIRIS, BAPHOMET, DOPPELGANGER, MISTRESS, GOLDEN_BUG, ORK_HERO, DRAKE, EDDGA, MAYA, MOONLIGHT, PHARAOH, PHREEONI, ORC_LORD, KNIGHT_OF_WINDSTORM, GARM, DARK_LORD, TURTLE_GENERAL, LORD_OF_DEATH, DRACULA, DARK_SNAKE_LORD, INCANTATION_SAMURAI, AMON_RA, TAO_GUNKA, RSX_0806, BACSOJIN_, B_SEYREN, B_EREMES, B_HARWORD, B_MAGALETA, B_SHECIL, B_KATRINN, B_YGNIZEM, APOCALIPS_H, LADY_TANEE, THANATOS, DETALE, KIEL_, RANDGRIS, GLOOMUNDERNIGHT, KTULLANUX, ATROCE, IFRIT, FALLINGBISHOP, BEELZEBUB_, GOPINICH, MOROCC_, KUBLIN, S_NYDHOG, BOITATA] }
            Consume: true
            Claim: { Name: ct.snare, For: 8000 }
            Cooldown: 5000
          # Coming for the back line (the Priest or a caster) and still 4+ cells from the
          # Hunter: a snare 2 cells in front of it, on its way in.
          - Name: ct_trap_guard_back
            Priority: 55
            Cast: HT_ANKLESNARE
            Target: { Enemy: attacking, Job: [Priest, Mage], NotSelf: true, Range: 9 }   # Job: Acolyte also matched a Monk/Champion
            Aim: { Cells: 2, From: target, Lead: true }
            When: [not_enemy_ankle, enemy_distance_ge4]
            Absent: { Enemy: boss, Mob: [OSIRIS, BAPHOMET, DOPPELGANGER, MISTRESS, GOLDEN_BUG, ORK_HERO, DRAKE, EDDGA, MAYA, MOONLIGHT, PHARAOH, PHREEONI, ORC_LORD, KNIGHT_OF_WINDSTORM, GARM, DARK_LORD, TURTLE_GENERAL, LORD_OF_DEATH, DRACULA, DARK_SNAKE_LORD, INCANTATION_SAMURAI, AMON_RA, TAO_GUNKA, RSX_0806, BACSOJIN_, B_SEYREN, B_EREMES, B_HARWORD, B_MAGALETA, B_SHECIL, B_KATRINN, B_YGNIZEM, APOCALIPS_H, LADY_TANEE, THANATOS, DETALE, KIEL_, RANDGRIS, GLOOMUNDERNIGHT, KTULLANUX, ATROCE, IFRIT, FALLINGBISHOP, BEELZEBUB_, GOPINICH, MOROCC_, KUBLIN, S_NYDHOG, BOITATA] }
            Consume: true
            Claim: { Name: ct.snare, For: 8000 }
            Cooldown: 6000
          # Two or more coming together: Sandman (5x5 sleep) in their path when one steps in.
          - Name: ct_trap_sleep_the_pack
            Priority: 54
            Cast: HT_SANDMAN
            Target: { Enemy: attacking, Range: 9 }
            Count: { Enemy: attacking, Around: target, Range: 2, AtLeast: 2 }
            Aim: { Cells: 2, From: self }
            When: [not_enemy_sleep, enemy_distance_ge4, self_sp_pct_ge20]
            Absent: { Enemy: boss, Mob: [OSIRIS, BAPHOMET, DOPPELGANGER, MISTRESS, GOLDEN_BUG, ORK_HERO, DRAKE, EDDGA, MAYA, MOONLIGHT, PHARAOH, PHREEONI, ORC_LORD, KNIGHT_OF_WINDSTORM, GARM, DARK_LORD, TURTLE_GENERAL, LORD_OF_DEATH, DRACULA, DARK_SNAKE_LORD, INCANTATION_SAMURAI, AMON_RA, TAO_GUNKA, RSX_0806, BACSOJIN_, B_SEYREN, B_EREMES, B_HARWORD, B_MAGALETA, B_SHECIL, B_KATRINN, B_YGNIZEM, APOCALIPS_H, LADY_TANEE, THANATOS, DETALE, KIEL_, RANDGRIS, GLOOMUNDERNIGHT, KTULLANUX, ATROCE, IFRIT, FALLINGBISHOP, BEELZEBUB_, GOPINICH, MOROCC_, KUBLIN, S_NYDHOG, BOITATA] }
            Consume: true
            Claim: { Name: ct.sandman, For: 10000 }
            Cooldown: 10000
          # Burst: 3+ bunched up and coming. Claymore (fire, 5x5) in their path, the Hunter's
          # share of the burst; bosses too.
          - Name: ct_trap_claymore_the_pack
            Priority: 45
            Cast: HT_CLAYMORETRAP
            Target: { Enemy: attacking, Range: 9 }
            Count: { Enemy: attacking, Around: target, Range: 2, AtLeast: 3 }
            Aim: { Cells: 2, From: self }
            When: [enemy_distance_ge4, self_sp_pct_ge30]
            Consume: true
            Claim: { Name: ct.claymore, For: 6000 }
            Cooldown: 4000
